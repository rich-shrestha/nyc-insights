name: Mark used

# Triggered when the repo owner opens an issue titled "used: <cluster id>" or "unuse: <cluster id>"
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  mark:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'used:') || startsWith(github.event.issue.title, 'unuse:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update used.yml and rebuild site data
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          python scripts/mark_used.py "$TITLE"
          python run_all.py --skip-collect
      - name: Commit
        run: |
          git config user.name "nyc-insights-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/used.yml data docs
          git diff --cached --quiet || git commit -m "Mark used: ${{ github.event.issue.number }}"
          git pull --rebase --autostash
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Done. config/used.yml updated; the site refreshes in a minute or two."
