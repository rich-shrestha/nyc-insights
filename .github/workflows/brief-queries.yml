name: Run brief queries

# Manually run the Socrata queries in config/brief_queries.yml (the ones content_briefs.md uses)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run queries
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/run_queries.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "nyc-insights-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brief_results
          git diff --cached --quiet || git commit -m "Brief query results $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
